<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>自然风光欣赏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft Yahei", sans-serif;
            background-color: #edf7f2;
            color: #2c3e50;
            line-height: 1.7;
        }
        .box {
            width: 820px;
            margin: 40px auto;
            background: #ffffff;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 3px 12px #c2d8ce;
        }
        h1 {
            text-align: center;
            color: #20754f;
            margin-bottom: 24px;
        }
        h3 {
            color: #298b60;
            margin: 20px 0 10px;
        }
        p {
            font-size: 17px;
        }
        ul {
            padding-left: 26px;
            margin:12px 0;
            font-size:17px;
        }
        .tips {
            background-color:#e8f5f0;
            padding:16px;
            border-radius:8px;
            margin:22px 0;
        }
        footer {
            margin-top:35px;
            text-align:center;
            color:#647470;
            font-size:14px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>自然风光欣赏</h1>
        <p>大自然拥有丰富多样的景色，山川、湖泊、森林与海洋共同构成了美丽的生态画卷。欣赏自然景色，既能放松身心，也能感受万物的生机。</p>

        <h3>值得观赏的自然景观</h3>
        <ul>
            <li>连绵群山：层叠的山峰，云雾缭绕，气势壮阔</li>
            <li>静谧湖泊：清澈水面倒映天空与林木</li>
            <li>原始森林：草木繁茂，充满动植物生机</li>
            <li>海岸海景：海浪沙滩，感受海风与落日</li>
        </ul>

        <div class="tips">
            <h3>小提示</h3>
            <p>外出亲近自然时，要爱护环境，不乱扔垃圾，保护动植物，做到文明游览。</p>
        </div>

        <h3>感悟</h3>
        <p>自然美景可以治愈心情，我们应当树立环保意识，守护好地球上的每一处风景。</p>

        <footer>
            Web前端随堂作业 work1
        </footer>
    </div>
</body>
</html>
